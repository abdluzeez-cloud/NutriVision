{% extends "base.html" %}{% block content %}<section class="head"><b>PERSONAL CALCULATOR</b><h1>Your daily calorie target</h1><p>Estimate BMR, TDEE, BMI and a daily target.</p></section><section class="two"><form id="calc" class="panel"><label>Age<input name="age" type="number" value="30"></label><label>Weight (kg)<input name="weight" type="number" value="70"></label><label>Height (cm)<input name="height" type="number" value="170"></label><label>Sex<select name="sex"><option value="female">Female</option><option value="male">Male</option></select></label><label>Activity<select name="activity"><option value="1.2">Sedentary</option><option value="1.375" selected>Lightly active</option><option value="1.55">Moderately active</option><option value="1.725">Very active</option></select></label><label>Goal<select name="goal"><option value="lose">Lose weight</option><option value="maintain" selected>Maintain</option><option value="gain">Gain weight</option></select></label><button class="btn">Calculate</button></form><div id="results" class="results"><article>DAILY TARGET<strong>—</strong>kcal/day</article><article>BMR<strong>—</strong>kcal</article><article>TDEE<strong>—</strong>kcal</article><article>BMI<strong>—</strong></article></div></section>{% endblock %}
